---
- name: Install firewalld
  dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is started and enabled
  service:
    name: firewalld
    state: started
    enabled: yes

- name: Set default zone
  command: firewall-cmd --set-default-zone={{ firewall_default_zone }}
  changed_when: false

- name: Allow TCP ports
  firewalld:
    port: "{{ item }}/tcp"
    permanent: yes
    state: enabled
    zone: "{{ firewall_default_zone }}"
  loop: "{{ firewall_allowed_tcp_ports }}"
  notify: reload firewalld

- name: Allow UDP ports
  firewalld:
    port: "{{ item }}/udp"
    permanent: yes
    state: enabled
    zone: "{{ firewall_default_zone }}"
  loop: "{{ firewall_allowed_udp_ports }}"
  notify: reload firewalld

- name: Allow services
  firewalld:
    service: "{{ item }}"
    permanent: yes
    state: enabled
    zone: "{{ firewall_default_zone }}"
  loop: "{{ firewall_allowed_services }}"
  notify: reload firewalld
