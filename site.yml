---
- name: Configure Linux servers
  hosts: all
  become: yes

  roles:
    - role: baseline
      tags: baseline
    - role: users
      tags: users
    - role: ntp
      tags: ntp
    - role: firewall
      tags: firewall
    - role: security
      tags: security

- name: Configure web servers
  hosts: webservers
  become: yes

  roles:
    - role: webserver
      tags: webserver
